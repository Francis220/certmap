name: Scrape EAC certifications

on:
  schedule:
    - cron: "0 6 * * *"   # 6am UTC daily
  workflow_dispatch:        # manual trigger from GitHub UI

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run EAC scraper
        run: npm run scrape

      - name: Check for file changes
        id: git_diff
        run: |
          if git diff --quiet src/data/systems.json src/data/changes.json; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate CSV/JSON downloads
        if: steps.git_diff.outputs.has_changes == 'true'
        run: npm run build:data

      - name: Create update pull request
        if: steps.git_diff.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/eac-certification-data
          delete-branch: true
          commit-message: "chore: update EAC certification data"
          title: "chore: update EAC certification data"
          body: |
            Automated EAC certification data update.

            This PR was created by the scheduled scraper workflow.
          add-paths: |
            src/data/systems.json
            src/data/changes.json
            public/certmap-data.csv
            public/certmap-data.json
